name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Ruby × Rails pairs Rails itself supports, across everything the
        # gemspec allows (Ruby >= 3.2, Rails 7.1 through 8.x).
        include:
          - { ruby: "3.2", rails: "7.1" }
          - { ruby: "3.2", rails: "7.2" }
          - { ruby: "3.2", rails: "8.0" }
          - { ruby: "3.3", rails: "7.2" }
          - { ruby: "3.3", rails: "8.0" }
          - { ruby: "3.3", rails: "8.1" }
          - { ruby: "3.4", rails: "8.0" }
          - { ruby: "3.4", rails: "8.1" }

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Unit tests, the dummy Rails app end to end (real test run, capture,
      # exporters), the generated cURL and Postman collection replayed against
      # a live Puma, and every example app in examples/.
      - name: Run the test suite
        run: bundle exec rake test

  build:
    name: Build gem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The gemspec ships `git ls-files`; building from a checkout proves the
      # package is complete and installable.
      - name: Build
        run: gem build reqcord.gemspec

      # Not --local: the runtime dependencies (railties, actionpack) come from
      # rubygems.org, exactly as they would for a user.
      - name: Install the built gem outside the bundle
        run: gem install ./reqcord-*.gem

      # A block scalar: on a plain line YAML would read ` #` as a comment and
      # truncate the command.
      - name: Smoke test the installed gem
        run: |
          ruby -e 'require "reqcord"; puts "reqcord " + Reqcord::VERSION + ": " + Reqcord::Exporters.names.join(", ")'
