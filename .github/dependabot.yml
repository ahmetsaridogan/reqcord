version: 2

# No bundler entry: the gem declares open-ended dependencies in the gemspec
# and commits no Gemfile.lock, so there is nothing for Dependabot to bump.
# Rails major versions are a deliberate decision (railties/actionpack < 9).
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
